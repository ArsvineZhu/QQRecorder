exclude_globs = ["CHANGELOG*", "README*", "AGENTS*", "docs/**"]

[[rules]]
name = "pyproject project version"
path = "pyproject.toml"
match = '(?m)^version = "[^"]+"$'
replace = 'version = "{version}"'
required = true

[[rules]]
name = "plugin manifest version"
path = "plugins/qq_recorder/manifest.toml"
match = '(?m)^version = "[^"]+"$'
replace = 'version = "{version}"'
required = true

[[rules]]
name = "plugin class version"
path = "plugins/qq_recorder/plugin.py"
match = '(?m)^    version = "[^"]+"$'
replace = '    version = "{version}"'
required = true

[[rules]]
name = "uv lock editable package version"
path = "uv.lock"
match = '(?ms)(name = "qqrecorder"\nversion = ")[^"]+(")'
replace = '\g<1>{version}\g<2>'
required = true

