enabled: false
recorder_db: "D:/absolute/path/to/recorder.db"
monitor_all: false

targets:
  groups: ["group_id_here"]
  private: ["qq_id_here"]

trigger:
  private_enabled: true
  group_enabled: true
  prefixes: ["/ask", "/ai", "grok"]
  allow_at: true
  allow_reply_to_bot: false
  ignore_self: true
  ignore_recorder_command: true

read_after_write:
  timeout_ms: 2000
  backoff_ms: [50, 100, 200, 400, 800]

context:
  mode: topic_ai  # recent=纯最近消息；topic_ai=局部优先，按需扩展话题摘要
  recent_limit_group: 6
  recent_limit_private: 10
  local_recent_limit_group: 30
  local_recent_limit_private: 30
  local_recent_time_window_minutes_group: 30
  local_recent_time_window_minutes_private: 30
  quote_chain_max_depth_group: 10
  quote_chain_max_depth_private: 10
  quote_neighbor_limit_group: 10
  quote_neighbor_limit_private: 10
  quote_chars_group: 320
  quote_chars_private: 480
  total_chars_group: 6000
  total_chars_private: 2200
  recent_chars_group: 120
  recent_chars_private: 180
  # 仅在模型首轮明确申请更多上下文时，才会启用下面的大范围候选集
  candidate_limit_group: 80
  candidate_limit_private: 30
  candidate_time_window_minutes_group: 45
  candidate_time_window_minutes_private: 30
  selected_max_messages_group: 20
  selected_max_messages_private: 12
  forward_max_items: 12
  forward_max_chars: 1600
  fallback_recent_limit_group: 16
  fallback_recent_limit_private: 12

topic_analyzer:
  enabled: true
  model: ""
  temperature: 0.2
  timeout_sec: 8
  min_confidence: 0.45
  fallback_to_recent: true
  max_summary_chars: 800

cooldown:
  group_chat_sec: 2.0
  group_user_sec: 5.0
  private_user_sec: 1.0

model:
  provider: ncatbot_ai
  model: ""
  temperature: 0.7
  max_tokens_group: 220
  max_tokens_private: 420
  timeout_sec: 12
  retries: 1
  llm_concurrency: 2

send:
  group_use_reply_segment: true
  group_at_sender: false
  group_max_chars_per_part: 250
  private_max_chars_per_part: 500
  group_max_parts: 2
  private_max_parts: 3
  retry_once: true

trace:
  enabled: true
  preview_chars: 240
  log_runtime: true
  log_context_blocks: false
  log_chars: 4000
  pretty_print: false

lock_retry:
  enabled: true
  max_retries: 5
  base_delay_ms: 50

vision:
  enabled: false
  dashscope_api_key: ""
  temperature: 0.4
  timeout_sec: 20

  # Model routing
  image_fast_model: qwen3-vl-flash
  image_detail_model: qwen3-vl-plus
  image_deep_semantic_model: qwen3.7-plus
  video_summary_model: qwen3.6-flash

  # Size gating
  source_image_bytes_threshold: 52428800     # 50MB — skip images larger than this
  api_image_bytes_max: 10485760             # 10MB — compress to this before API

  max_images_per_message: 3
  include_in_context: true
  cache_enabled: true
  cache_ttl_days: 30
  prompt_version: visual_v1
  schema_version: visual_semantic_json_v1
  daily_limit_image_per_user_chat: 30
  daily_limit_image_global: 500

  # Router
  router_image_bytes_threshold: 1048576     # 1MB — use detail/semantic model if above

  # Escalation
  escalation_enabled: true
  escalation_min_confidence: 0.65
  escalation_max_images_escalate: 1

  # Video
  video_max_duration_min: 30
  video_max_bytes: 524288000
  video_timeout_sec: 60
