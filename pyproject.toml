[project]
name = "qqrecorder"
version = "1.2.4"
description = "静默 QQ 消息记录器 —— 基于 NcatBot 的 QQ 消息自动记录插件"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Arsvine Zhu", url = "https://github.com/Arsvinezhu" },
]
keywords = ["qq", "recorder", "ncatbot", "bot", "message"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "ncatbot5>=5.5.3.post1",
    "ruff>=0.15.12",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19.0",
    "aiohttp>=3.9",
]

[project.urls]
Repository = "https://github.com/Arsvinezhu/QQRecorder"
